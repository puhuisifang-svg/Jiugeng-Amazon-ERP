name: Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deliverables/backend/**"
      - "scripts/**"
      - "infra/**"
      - "compose*.yml"
      - "docker-compose*.yml"
      - ".github/workflows/production.yml"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    # Keep the browser smoke environment aligned with the frontend CI job.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify application and deployment tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/production -p 'test_*.py'
          for script in scripts/production/*.sh; do bash -n "$script"; done
          cd deliverables/backend/sprint-0/jiugeng-erp-backend
          ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Frontend quality gates
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm quality
      - name: Verify built frontend starts in browser
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - name: Import contract gate
        working-directory: deliverables/backend/sprint-0/import-contract/tests
        run: |
          npm ci --ignore-scripts
          npm test
          python3 validate_contract.py
      - name: Package tested revision
        run: |
          python3 scripts/production/release.py build . release.tar.gz "$GITHUB_SHA"
          sha256sum release.tar.gz > release.tar.gz.sha256
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('provenance.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'], 'buildRun': os.environ['GITHUB_RUN_ID'],
              'buildAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'sha256': Path('release.tar.gz.sha256').read_text().split()[0],
              'bytes': Path('release.tar.gz').stat().st_size,
              'mode': 'production-tested-package'
          }, indent=2)+'\n')
          PY
      - name: Retain tested release before network deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erp-release-${{ github.sha }}
          path: |
            release.tar.gz
            release.tar.gz.sha256
            provenance.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deploy through restricted SSH command
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/erp-ssh"
          trap 'rm -f "$RUNNER_TEMP/erp-ssh/key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/erp-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/erp-ssh/known_hosts"
          export DEPLOY_KEY_FILE="$RUNNER_TEMP/erp-ssh/key"
          export DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/erp-ssh/known_hosts"
          git fetch origin main
          python3 scripts/production/verify_retry_source.py "$GITHUB_SHA"
          python3 scripts/production/upload_release.py release.tar.gz "$GITHUB_SHA"
          echo "Published revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
