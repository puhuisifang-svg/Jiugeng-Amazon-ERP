name: jiugeng-erp

services:
  mysql:
    image: mysql@sha256:64756cc92f707eb504496d774353990bcb0f6999ddf598b6ad188f2da66bd000
    container_name: jiugeng-erp-mysql
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_DATABASE: ${ERP_MYSQL_DATABASE:-jiugeng_erp}
      MYSQL_USER: ${ERP_MYSQL_USER:-jiugeng_erp}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    ports:
      - "127.0.0.1:${ERP_MYSQL_PORT:-13306}:3306"
    volumes:
      - erp_mysql_data:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_app_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - erp_internal

  redis:
    image: redis@sha256:5f8bafd0669a697ee564ad825c2a63e6b60b0a67c02b0089f8a250051ab6fe85
    container_name: jiugeng-erp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${ERP_REDIS_PORT:-16379}:6379"
    volumes:
      - erp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - erp_internal

  object-storage:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: jiugeng-erp-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "127.0.0.1:${ERP_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${ERP_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - erp_minio_data:/data
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - erp_internal

networks:
  erp_internal:
    name: jiugeng-erp-internal

volumes:
  erp_mysql_data:
    name: jiugeng-erp-mysql-data
  erp_redis_data:
    name: jiugeng-erp-redis-data
  erp_minio_data:
    name: jiugeng-erp-minio-data

secrets:
  mysql_root_password:
    file: ${ERP_LOCAL_SECRET_DIR:-.local/secrets}/mysql_root_password
  mysql_app_password:
    file: ${ERP_LOCAL_SECRET_DIR:-.local/secrets}/mysql_app_password
  minio_root_user:
    file: ${ERP_LOCAL_SECRET_DIR:-.local/secrets}/minio_root_user
  minio_root_password:
    file: ${ERP_LOCAL_SECRET_DIR:-.local/secrets}/minio_root_password
