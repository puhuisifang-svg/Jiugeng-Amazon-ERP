spring:
  application:
    name: jiugeng-erp-backend
  datasource:
    url: jdbc:h2:mem:jiugeng;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful
