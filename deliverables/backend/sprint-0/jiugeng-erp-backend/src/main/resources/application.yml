spring:
  application:
    name: jiugeng-erp-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful

app:
  catalog:
    image-dir: ${ERP_CATALOG_IMAGE_DIR:${user.home}/.jiugeng-erp/catalog-images}
    image-orphan-hours: ${ERP_CATALOG_IMAGE_ORPHAN_HOURS:24}
    image-cleanup-cron: ${ERP_CATALOG_IMAGE_CLEANUP_CRON:0 45 4 * * *}
  dashboard:
    image-dir: ${ERP_DASHBOARD_IMAGE_DIR:${user.home}/.jiugeng-erp/dashboard-images}
    image-orphan-hours: ${ERP_DASHBOARD_IMAGE_ORPHAN_HOURS:24}
    image-cleanup-cron: ${ERP_DASHBOARD_IMAGE_CLEANUP_CRON:0 15 4 * * *}
  imports:
    staging-dir: ${ERP_IMPORT_STAGING_DIR:${java.io.tmpdir}/jiugeng-erp-import-staging}
    retention-days: ${ERP_IMPORT_RETENTION_DAYS:7}
    cleanup-cron: ${ERP_IMPORT_CLEANUP_CRON:0 30 3 * * *}
    templates-dir: ${ERP_IMPORT_TEMPLATES_DIR:../../../../deliverables/pm/excel_templates}
    preview-hours: ${ERP_IMPORT_PREVIEW_HOURS:24}
  iam:
    session-hours: ${ERP_SESSION_HOURS:8}
    max-failed-logins: ${ERP_MAX_FAILED_LOGINS:5}
    password-reset:
      email-from: ${ERP_PASSWORD_RESET_EMAIL_FROM:}
      sms-webhook-url: ${ERP_PASSWORD_RESET_SMS_WEBHOOK_URL:}
      sms-webhook-token: ${sms_webhook_token:}
    bootstrap:
      login-name: ${ERP_BOOTSTRAP_ADMIN_LOGIN:}
      display-name: ${ERP_BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
      password: ${bootstrap_admin_password:${ERP_BOOTSTRAP_ADMIN_PASSWORD:}}
